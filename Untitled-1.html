<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تثبيت البوت الخاص بك</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1f22;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #2b2d31;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 {
            margin-bottom: 10px;
        }
        p {
            color: #b5bac1;
            margin-bottom: 25px;
        }
        .btn {
            background-color: #5865f2;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            transition: 0.2s;
        }
        .btn:hover {
            background-color: #4752c4;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>مرحباً بك في البوت!</h1>
        <p>أضف البوت إلى سيرفرك للتحكم بالإعلانات والرسائل بسهولة.</p>
        <!-- استبدل الرابط أدناه برابط OAuth2 الخاص ببوتك -->
        <a href="https://discord.com/oauth2/authorize?client_id=1555536447451299930&permissions=8&integration_type=0&scope=bot+applications.commands" class="btn" target="_blank">Add to Discord 🚀</a>
    </div>
</body>
</html>
